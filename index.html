<style>
  :root{
    --bg:#F6F4EF;
    --card:#FFFFFF;
    --text:#213531;
    --text-muted:#6E7D78;
    --border:#E7E2D8;
    --accent:#A63860;
    --accent-soft:#F7E8EE;
    --accent-ink:#7A2A48;
    --cal-trained:#3FA772;
    --cal-planned:#E8973A;
    --shadow: 0 1px 2px rgba(33,53,49,.04), 0 8px 24px -12px rgba(33,53,49,.18);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#141F1D;
      --card:#1C2926;
      --text:#EDEFEC;
      --text-muted:#9FB1AB;
      --border:#2B3835;
      --accent:#D9678F;
      --accent-soft:rgba(217,103,143,.16);
      --accent-ink:#F3B4CD;
      --cal-trained:#2E8158;
      --cal-planned:#B97324;
      --shadow: 0 1px 2px rgba(0,0,0,.2), 0 10px 26px -14px rgba(0,0,0,.55);
    }
  }
  :root[data-theme="dark"]{
    --bg:#141F1D;
    --card:#1C2926;
    --text:#EDEFEC;
    --text-muted:#9FB1AB;
    --border:#2B3835;
    --accent:#D9678F;
    --accent-soft:rgba(217,103,143,.16);
    --accent-ink:#F3B4CD;
    --cal-trained:#2E8158;
    --cal-planned:#B97324;
    --shadow: 0 1px 2px rgba(0,0,0,.2), 0 10px 26px -14px rgba(0,0,0,.55);
  }

  *{box-sizing:border-box;}
  html{background:var(--bg);height:100%;overflow:hidden;}
  body{
    margin:0;
    height:100%;
    overflow:hidden;
    overscroll-behavior:none;
    background:var(--bg);
    color:var(--text);
    font-family:"Manrope",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3{
    font-family:"Fraunces","Iowan Old Style",Georgia,serif;
    font-weight:600;
    letter-spacing:-0.01em;
    text-wrap:balance;
    margin:0;
  }
  button{font-family:inherit;}

  .shell{
    /* position:fixed pint de hele app-schil vast aan het scherm, los van de
       paginascroll van Safari zelf — zo kan de boven-/onderbalk nooit meer
       "meeveren" of wegvallen bij het scrollen. Alleen .screens scrolt. */
    position:fixed;
    top:0;
    bottom:0;
    left:50%;
    transform:translateX(-50%);
    width:100%;
    max-width:460px;
    display:flex;
    flex-direction:column;
    background:var(--bg);
  }
  @media (min-width:560px){
    .shell{
      position:relative;
      top:auto;
      bottom:auto;
      left:auto;
      transform:none;
      margin:24px auto;
      height:min(100vh,860px);
      height:min(100svh,860px);
      border-radius:28px;
      box-shadow:var(--shadow);
      overflow:hidden;
      border:1px solid var(--border);
    }
  }

  .topbar{
    padding:calc(22px + env(safe-area-inset-top)) 22px 16px;
    flex-shrink:0;
  }
  .topbar .eyebrow{
    font-size:12.5px;
    font-weight:700;
    letter-spacing:.08em;
    text-transform:uppercase;
    color:var(--accent-ink);
    margin:0 0 4px;
  }
  .topbar h1{font-size:26px;}

  .screens{
    flex:1;
    min-height:0;
    overflow-y:auto;
    overscroll-behavior:contain;
    padding:4px 20px 28px;
    -webkit-overflow-scrolling:touch;
  }
  /* de exacte extra ruimte onderin (zodra een tekstveld actief is) wordt
     via JavaScript ingesteld op basis van de echte toetsenbordhoogte,
     zodat een knop onder een formulier (zoals "Opslaan") precies boven
     het toetsenbord blijft staan in plaats van midden in beeld te zweven */
  .screen{display:none;}
  .screen.active{display:block;}

  .stack{display:flex;flex-direction:column;gap:14px;}

  .card{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:18px;
    padding:18px;
    box-shadow:var(--shadow);
  }

  .muted{color:var(--text-muted);}
  .small{font-size:13px;}
  .link-btn{
    appearance:none;border:none;background:none;cursor:pointer;
    color:var(--accent-ink);font-weight:700;font-size:13px;padding:0;
    display:inline-flex;align-items:center;gap:4px;
  }

  /* HOME */
  .hero{
    background:linear-gradient(155deg,var(--accent) 0%,var(--accent-ink) 100%);
    color:#F2FBF9;
    border-radius:20px;
    padding:22px;
    display:flex;
    flex-direction:column;
    gap:14px;
    box-shadow:var(--shadow);
  }
  .hero p{margin:0;color:#D8F1EC;font-size:14px;}
  .hero-title{font-size:22px;font-family:"Fraunces",serif;font-weight:600;}
  .btn-primary{
    appearance:none;border:none;cursor:pointer;
    background:#F2FBF9;color:var(--accent-ink);
    font-weight:700;font-size:16px;
    padding:14px 18px;border-radius:14px;
    text-align:left;
    display:flex;align-items:center;justify-content:space-between;gap:10px;
  }
  .btn-primary:active{transform:scale(.98);}

  .empty{
    display:flex;flex-direction:column;gap:6px;align-items:flex-start;
    padding:6px 2px;
  }
  .empty-icon{
    width:38px;height:38px;border-radius:11px;flex-shrink:0;
    background:var(--accent-soft);color:var(--accent-ink);
    display:flex;align-items:center;justify-content:center;
    margin-bottom:6px;
  }
  .card-title{font-size:13px;font-weight:700;letter-spacing:.03em;text-transform:uppercase;color:var(--text-muted);margin:0 0 10px;}

  .last-training-row{display:flex;align-items:center;gap:12px;}
  .last-training-date{font-family:"Fraunces",serif;font-size:17px;font-weight:600;text-transform:capitalize;}

  .stat-row{display:flex;gap:12px;}
  .stat{
    flex:1;background:var(--card);border:1px solid var(--border);
    border-radius:16px;padding:14px;box-shadow:var(--shadow);
  }
  .stat .n{font-family:"Fraunces",serif;font-size:26px;font-variant-numeric:tabular-nums;}
  .stat .l{font-size:12.5px;color:var(--text-muted);}

  /* TRAINING */
  .ex-card{background:var(--card);border:1px solid var(--border);border-radius:18px;padding:16px;box-shadow:var(--shadow);}
  .ex-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:2px;}
  .ex-name{font-family:"Fraunces",serif;font-size:18px;font-weight:600;}
  .ex-target{font-size:13px;color:var(--text-muted);margin-top:3px;}
  .pill{
    font-size:11.5px;font-weight:700;color:var(--accent-ink);
    background:var(--accent-soft);padding:4px 9px;border-radius:99px;white-space:nowrap;
  }
  .ex-prev{font-size:12.5px;color:var(--text-muted);font-style:italic;margin:10px 0 12px;}
  .ex-prev b{font-style:normal;color:var(--text);}

  .stepper-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 0;}
  .stepper-label{font-size:13px;color:var(--text-muted);font-weight:600;min-width:52px;}
  .num-field{display:flex;align-items:center;gap:8px;}
  .num-input{
    width:88px;text-align:center;font-variant-numeric:tabular-nums;
    font-size:16px;font-weight:700;color:var(--text);
    border:1px solid var(--border);border-radius:10px;
    background:var(--bg);padding:9px 6px;
    -moz-appearance:textfield;appearance:textfield;
  }
  .num-input:focus{outline:none;border-color:var(--accent);}
  .num-input::-webkit-inner-spin-button,
  .num-input::-webkit-outer-spin-button{-webkit-appearance:none;margin:0;}
  .num-unit{font-size:13px;color:var(--text-muted);font-weight:600;}

  .sets-row{display:flex;gap:10px;padding-top:6px;flex-wrap:wrap;}
  .set-dot{
    width:36px;height:36px;border-radius:50%;
    border:1.5px solid var(--border);background:var(--bg);
    color:var(--text-muted);font-size:13px;font-weight:700;
    display:flex;align-items:center;justify-content:center;cursor:pointer;
  }
  .set-dot.done{
    background:var(--accent);border-color:var(--accent);color:#fff;
  }

  .save-bar{
    flex-shrink:0;
    background:var(--bg);
    border-top:1px solid var(--border);
    padding:14px 20px 10px;
  }
  .btn-save{
    width:100%;appearance:none;border:none;cursor:pointer;
    background:var(--accent);color:#F2FBF9;
    font-weight:700;font-size:16px;padding:15px;border-radius:14px;
    box-shadow:var(--shadow);
  }
  .btn-save:active{transform:scale(.99);}

  /* HISTORIE */
  .hist-card-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px;}
  .hist-card .hist-date{
    font-family:"Fraunces",serif;font-size:16.5px;font-weight:600;
    text-transform:capitalize;margin-bottom:10px;
  }
  .hist-card-head .hist-date{margin-bottom:0;}
  .hist-edit-btn{
    background:none;border:none;color:var(--accent-ink);
    font-size:12.5px;font-weight:700;cursor:pointer;
    padding:5px 4px;flex-shrink:0;
  }
  .hist-row{
    display:flex;justify-content:space-between;gap:10px;
    font-size:13.5px;padding:7px 0;border-top:1px solid var(--border);
  }
  .hist-row:first-of-type{border-top:none;}
  .hist-ex{color:var(--text);font-weight:600;}
  .hist-vals{color:var(--text-muted);font-variant-numeric:tabular-nums;white-space:nowrap;}

  .hist-row-edit{
    display:flex;flex-direction:column;gap:8px;
    padding:10px 0;border-top:1px solid var(--border);
  }
  .hist-row-edit:first-of-type{border-top:none;}
  .hist-edit-name{font-size:13.5px;font-weight:600;color:var(--text);}
  .hist-edit-fields{display:flex;align-items:center;gap:6px;flex-wrap:wrap;}
  .num-input-sm{width:56px;padding:8px 2px;font-size:16px;}
  .hist-edit-actions{display:flex;gap:10px;margin-top:2px;}

  /* SCHEMA */
  .schema-card{display:flex;justify-content:space-between;align-items:center;gap:12px;}
  .schema-meta{font-size:12.5px;color:var(--text-muted);margin-top:4px;}
  .icon-btn{
    width:36px;height:36px;flex-shrink:0;border-radius:11px;border:1px solid var(--border);
    background:var(--bg);color:var(--text-muted);cursor:pointer;
    display:flex;align-items:center;justify-content:center;
  }

  .action-link{
    display:flex;align-items:center;justify-content:center;gap:8px;
    width:100%;appearance:none;cursor:pointer;
    background:var(--accent-soft);color:var(--accent-ink);
    border:1px dashed var(--accent);
    font-weight:700;font-size:14.5px;padding:13px;border-radius:14px;
  }

  /* TRAININGSDAGEN */
  .chip-row{display:flex;flex-wrap:wrap;gap:8px;}
  .chip{
    appearance:none;cursor:pointer;font-family:inherit;
    border:1px solid var(--border);background:var(--bg);color:var(--text);
    font-size:13.5px;font-weight:700;padding:9px 15px;border-radius:99px;
  }
  .chip.active{background:var(--accent);border-color:var(--accent);color:#F2FBF9;}
  .chip.chip-add{border:1px dashed var(--accent);background:var(--accent-soft);color:var(--accent-ink);}
  .day-hint{font-size:12.5px;color:var(--text-muted);margin:12px 0 0;line-height:1.45;}
  .day-hint b{color:var(--text);}
  .day-actions{display:flex;flex-wrap:wrap;gap:8px 18px;margin-top:14px;padding-top:12px;border-top:1px solid var(--border);}
  .day-form{margin-top:14px;padding-top:14px;border-top:1px solid var(--border);}
  .day-form label{display:flex;flex-direction:column;gap:6px;font-size:12.5px;font-weight:700;color:var(--text-muted);}
  .hist-day{font-size:12.5px;font-weight:700;color:var(--accent-ink);margin-top:2px;}

  /* KALENDER */
  .cal-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
  .cal-month-label{font-family:"Fraunces",serif;font-size:16.5px;font-weight:600;text-transform:capitalize;}
  .cal-weekdays{display:grid;grid-template-columns:repeat(7,1fr);text-align:center;margin-bottom:6px;}
  .cal-weekdays span{font-size:11px;font-weight:700;color:var(--text-muted);text-transform:uppercase;letter-spacing:.03em;}
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;}
  .cal-day{
    aspect-ratio:1;display:flex;align-items:center;justify-content:center;
    border-radius:10px;font-size:13.5px;font-weight:600;color:var(--text);
    background:var(--bg);cursor:pointer;position:relative;border:1.5px solid transparent;
  }
  .cal-day.cal-empty{visibility:hidden;cursor:default;}
  .cal-day.cal-today{border-color:var(--accent);}
  .cal-day.cal-trained{background:var(--cal-trained);color:#fff;}
  .cal-day.cal-planned{background:var(--cal-planned);color:#fff;}
  .cal-legend{display:flex;flex-direction:column;gap:6px;margin-top:14px;padding-top:12px;border-top:1px solid var(--border);}
  .cal-legend-item{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--text-muted);}
  .cal-dot{width:11px;height:11px;border-radius:50%;flex-shrink:0;}
  .cal-dot-trained{background:var(--cal-trained);}
  .cal-dot-planned{background:var(--cal-planned);}

  /* VOORTGANG */
  .form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .form-grid label{display:flex;flex-direction:column;gap:6px;font-size:12.5px;font-weight:700;color:var(--text-muted);}
  .form-grid input{
    font-family:inherit;font-size:16px;color:var(--text);
    border:1px solid var(--border);border-radius:10px;padding:10px 11px;
    background:var(--bg);width:100%;
  }
  .form-grid input:focus{outline:2px solid var(--accent);outline-offset:1px;}
  .btn-secondary{
    appearance:none;cursor:pointer;background:var(--bg);color:var(--text-muted);
    border:1px solid var(--border);font-weight:700;font-size:15px;padding:14px;border-radius:14px;
  }
  .measure-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;}
  .measure-cell{background:var(--bg);border:1px solid var(--border);border-radius:12px;padding:10px 12px;}
  .measure-label{font-size:12px;color:var(--text-muted);font-weight:600;}
  .measure-value{font-family:"Fraunces",serif;font-size:18px;font-weight:600;font-variant-numeric:tabular-nums;margin-top:2px;}
  .trend-row{display:flex;align-items:center;gap:12px;padding:6px 0;}
  .trend-row + .trend-row{border-top:1px solid var(--border);}
  .trend-label{width:58px;flex-shrink:0;font-size:12.5px;font-weight:700;color:var(--text-muted);}
  .trend-value{margin-left:auto;font-variant-numeric:tabular-nums;font-weight:700;font-size:13.5px;flex-shrink:0;}

  /* BOTTOM NAV */
  .bottomnav{
    flex-shrink:0;
    display:flex;
    border-top:1px solid var(--border);
    background:var(--card);
    padding:8px 6px calc(10px + max(0px, env(safe-area-inset-bottom)));
    padding-bottom:max(14px, calc(10px + env(safe-area-inset-bottom)));
  }
  .navbtn{
    flex:1;appearance:none;border:none;background:none;cursor:pointer;
    display:flex;flex-direction:column;align-items:center;gap:4px;
    padding:9px 2px 8px;border-radius:14px;color:var(--text-muted);
  }
  .navbtn svg{width:23px;height:23px;display:block;}
  .navbtn span{font-size:11px;font-weight:600;}
  .navbtn.active{color:var(--accent-ink);background:var(--accent-soft);}

  .toast{
    position:fixed;left:50%;bottom:96px;transform:translate(-50%,12px);
    background:var(--text);color:var(--bg);
    font-size:13.5px;font-weight:600;
    padding:11px 16px;border-radius:12px;
    opacity:0;pointer-events:none;transition:opacity .18s ease, transform .18s ease;
    max-width:80%;text-align:center;z-index:20;
    box-shadow:0 10px 24px -8px rgba(0,0,0,.35);
  }
  .toast.show{opacity:1;transform:translate(-50%,0);}

  @media (prefers-reduced-motion: reduce){
    .btn-primary,.btn-save,.toast{transition:none;}
  }
</style>
</head>
<body>

<div class="shell">
  <div class="topbar">
    <p class="eyebrow" id="screenEyebrow">Vandaag</p>

  <main class="screens">

          </div>

        <div class="card">

        <div class="stat-row">

    <!-- VOORTGANG -->
    <section class="screen" id="screen-voortgang">
      <div class="stack">
        <button class="action-link" id="addMeasurementBtn">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
          <span id="addMeasurementLabel">Nieuwe meting toevoegen</span>
        </button>

        <div class="card" id="measurementForm" style="display:none;">
          <p class="card-title" id="measurementFormTitle">Nieuwe meting</p>
          <div class="form-grid">
            <label style="grid-column:1 / -1;">Datum
              <input type="date" id="mDate">

            <label style="grid-column:1 / -1;">Gewicht (kg)
              <input type="number" inputmode="decimal" step="0.1" id="mGewicht" placeholder="kg">
            </label>
            <label>Armen (cm)
              <input type="number" inputmode="decimal" step="0.5" id="mArmen" placeholder="cm">
            </label>
            <label>Benen (cm)
              <input type="number" inputmode="decimal" step="0.5" id="mBenen" placeholder="cm">

            <label>Buik (cm)
              <input type="number" inputmode="decimal" step="0.5" id="mBuik" placeholder="cm">

            <label>Billen (cm)
              <input type="number" inputmode="decimal" step="0.5" id="mBillen" placeholder="cm">
            </label>
          </div>
          <div style="display:flex;gap:10px;margin-top:14px;">
            <button type="button" class="btn-secondary" id="cancelMeasurementBtn" style="flex:1;">Annuleren</button>
            <button type="button" class="btn-save" id="saveMeasurementBtn" style="flex:1;">Opslaan</button>
          </div>
          <div id="measurementDeleteZone" style="margin-top:12px;text-align:center;"></div>
        </div>

        <div class="stack" id="measurementSummary"></div>
      </div>
    </section>

    <!-- SCHEMA -->
    <section class="screen" id="screen-schema">
      <div id="dayTabs" style="margin-bottom:14px;"></div>
      <div class="stack" id="schemaList"></div>
      <div class="stack" style="margin-top:14px;">
        <button class="action-link" id="addExerciseBtn">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
          <span id="addExerciseLabel">Oefening toevoegen</span>
        </button>
      </div>
    </section>

    <!-- KALENDER -->
    <section class="screen" id="screen-kalender">
      <div class="stack">
        <div class="card">
          <div class="cal-nav">
            <button type="button" class="icon-btn" id="calPrevBtn" aria-label="Vorige maand">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg>
            </button>
            <span id="calMonthLabel" class="cal-month-label">September 2026</span>
            <button type="button" class="icon-btn" id="calNextBtn" aria-label="Volgende maand">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
            </button>

          <div class="cal-weekdays">
            <span>ma</span><span>di</span><span>wo</span><span>do</span><span>vr</span><span>za</span><span>zo</span>

          <div class="cal-legend">
            <span class="cal-legend-item"><span class="cal-dot cal-dot-trained"></span>Getraind</span>
            <span class="cal-legend-item"><span class="cal-dot cal-dot-planned"></span>Gepland — tik op een dag</span>

  </main>

  <div class="save-bar" id="trainingSaveBar" style="display:none;">
    <button class="btn-save" id="saveTrainingBtn">Training opslaan</button>
  </div>

  <nav class="bottomnav" id="bottomnav">
    <button class="navbtn active" data-nav="home">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11.5 12 4l9 7.5"/><path d="M5.5 10v9h13v-9"/><path d="M10 19v-5h4v5"/></svg>
      <span>Home</span>
    </button>
    <button class="navbtn" data-nav="training">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 8v8M4 9v6M20 9v6M21.5 8v8M7 12h10"/></svg>
      <span>Training</span>
    </button>
    <button class="navbtn" data-nav="historie">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3.5 2"/></svg>
      <span>Historie</span>
    </button>
    <button class="navbtn" data-nav="voortgang">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 19v-6M12 19V7M19 19v-9"/></svg>

    </button>
    <button class="navbtn" data-nav="schema">

      <span>Schema</span>
    </button>
    <button class="navbtn" data-nav="kalender">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5" width="17" height="15" rx="2"/><path d="M3.5 9.5h17M8 3v4M16 3v4"/></svg>
      <span>Kalender</span>
    </button>
  </nav>

  <div class="toast" id="toast"></div>
</div>

<script>
(function(){
  // ---------- Opslag ----------
  var SCHEMA_KEY = 'gymapp_schema_v1';
  var HISTORY_KEY = 'gymapp_history_v1';
  var MEASURE_KEY = 'gymapp_measurements_v1';
  var PLANNED_KEY = 'gymapp_planned_v1';
  var DAYS_KEY = 'gymapp_days_v1';

  function loadJSON(key, fallback){
    try{
      var raw = localStorage.getItem(key);
      return raw ? JSON.parse(raw) : fallback;
    }catch(e){ return fallback; }
  }
  function saveJSON(key, val){
    try{ localStorage.setItem(key, JSON.stringify(val)); }
    catch(e){ toast('Opslaan is niet gelukt op dit apparaat'); }
  }

  var DEFAULT_SCHEMA = [
    { name:"Leg Press", sets:2, reps:"8-10", tempo:"3010", rust:null },
    { name:"Hip Adductor", sets:2, reps:"10", tempo:"3011", rust:"60 sec" },
    { name:"Bulgarian Split Squat", sets:3, reps:"8/8", tempo:"3010", rust:null },
    { name:"Hamstring Curl", sets:3, reps:"10", tempo:"3011", rust:"45 sec" },
    { name:"Lat Pulldown", sets:3, reps:"10", tempo:"3010", rust:null },
    { name:"Hanging Leg Raise", sets:3, reps:"12+", tempo:"2010", rust:"45 sec" },
    { name:"Chest Press", sets:3, reps:"8", tempo:null, rust:null },
    { name:"Decline Crunch", sets:3, reps:"12+", tempo:null, rust:"45 sec" },
    { name:"Plank", sets:2, reps:"45 sec", tempo:null, rust:null }
  ];

  function slugify(name){
    return String(name).toLowerCase()
      .normalize('NFD').replace(/[̀-ͯ]/g, '')
      .replace(/[^a-z0-9]+/g, '-').replace(/(^-|-$)/g, '') || 'oefening';
  }
  function escapeHtml(s){
    return String(s == null ? '' : s)
      .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  // ---------- Trainingsdagen ----------
  // Elke dag heeft een eigen naam en een eigen lijst oefeningen. Wie één dag
  // heeft (zoals "Full body") merkt niets van deze uitbreiding.
  function newId(prefix){ return prefix + '-' + Math.random().toString(36).slice(2, 7); }

  var days = loadJSON(DAYS_KEY, null);
  if (!days || !days.length){
    // Eerste keer met trainingsdagen: neem het bestaande schema over als één dag.
    // Het oude schema blijft ongemoeid in de opslag staan (veilig terugdraaien).
    var legacy = loadJSON(SCHEMA_KEY, null);
    if (!legacy || !legacy.length){
      legacy = DEFAULT_SCHEMA.map(function(ex){ return Object.assign({}, ex); });
    }
    days = [{ id: newId('dag'), name: 'Full body', exercises: legacy }];
  }
  // vult ontbrekende velden aan (voor oefeningen van vóór deze versie)
  days.forEach(function(d){
    if (!d.id) d.id = newId('dag');
    if (!d.name) d.name = 'Dag';
    if (!d.exercises) d.exercises = [];
    d.exercises.forEach(function(ex){
      if (!ex.id) ex.id = slugify(ex.name) + '-' + Math.random().toString(36).slice(2, 6);
      if (ex.notitie === undefined) ex.notitie = null;
      if (ex.apparaat === undefined) ex.apparaat = null;
    });
  });
  function saveDays(){ saveJSON(DAYS_KEY, days); }
  saveDays();

  function dayById(id){
    for (var i = 0; i < days.length; i++){ if (days[i].id === id) return days[i]; }
    return null;
  }
  // De dag die na de laatst getrainde dag komt (in de volgorde van de dagen).
  function suggestedDayId(){
    if (days.length === 1) return days[0].id;
    for (var i = history.length - 1; i >= 0; i--){
      if (history[i].dayId){
        for (var j = 0; j < days.length; j++){
          if (days[j].id === history[i].dayId) return days[(j + 1) % days.length].id;
        }
        break; // die dag bestaat niet meer
      }
    }
    return days[0].id;
  }
  // Naam van de dag bij een opgeslagen training (volgt een eventuele hernoeming).
  function dayLabel(session){
    var d = session.dayId ? dayById(session.dayId) : null;
    return d ? d.name : (session.dayName || '');
  }
  var trainingDayId = null; // gekozen dag op het Training-scherm
  var schemaDayId = days[0].id; // gekozen dag op het Schema-scherm
  function trainingDay(){ return dayById(trainingDayId) || dayById(suggestedDayId()) || days[0]; }
  function schemaDay(){ return dayById(schemaDayId) || days[0]; }

  var history = loadJSON(HISTORY_KEY, []);
  var measurements = loadJSON(MEASURE_KEY, []);
  var planned = loadJSON(PLANNED_KEY, []);
  trainingDayId = suggestedDayId();

  function findLastFor(ex){
    for (var i = history.length - 1; i >= 0; i--){
      var session = history[i];
      for (var j = 0; j < session.exercises.length; j++){
        var e = session.exercises[j];
        var match = (ex.id && e.id) ? (e.id === ex.id) : (e.name === ex.name);
        if (match) return { date: session.date, ex: e };
      }
    }
    return null;
  }

  function formatDateNL(iso){
    var d = new Date(iso + 'T00:00:00');
    var s = d.toLocaleDateString('nl-NL', { weekday:'long', day:'numeric', month:'long' });
    return s.charAt(0).toUpperCase() + s.slice(1);
  }
  function todayISO(){
    var d = new Date();
    var m = String(d.getMonth()+1).padStart(2,'0');
    var day = String(d.getDate()).padStart(2,'0');
    return d.getFullYear() + '-' + m + '-' + day;
  }
  function startOfWeekISO(){
    var d = new Date();
    var dow = (d.getDay() + 6) % 7; // maandag = 0
    d.setHours(0,0,0,0);
    d.setDate(d.getDate() - dow);
    var m = String(d.getMonth()+1).padStart(2,'0');
    var day = String(d.getDate()).padStart(2,'0');
    return d.getFullYear() + '-' + m + '-' + day;
  }

  // ---------- Toast ----------
  var toastEl = document.getElementById('toast');
  var toastTimer;
  function toast(msg){
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ toastEl.classList.remove('show'); }, 1800);
  }

  // ---------- Navigatie ----------
  var titles = {
    home: { eyebrow:"Vandaag", title:"Hoi Rosanne" },
    training: { eyebrow:"Training", title:"Aan de slag" },
    historie: { eyebrow:"Terugblik", title:"Historie" },
    voortgang: { eyebrow:"Lichaam", title:"Voortgang" },
    schema: { eyebrow:"Instellingen", title:"Mijn schema" },
    kalender: { eyebrow:"Overzicht", title:"Kalender" }
  };
  function goTo(name){
    document.querySelectorAll('.screen').forEach(function(s){
      s.classList.toggle('active', s.id === 'screen-' + name);
    });
    document.querySelectorAll('.navbtn').forEach(function(b){
      b.classList.toggle('active', b.dataset.nav === name);
    });
    var t = titles[name];
    document.getElementById('screenEyebrow').textContent = t.eyebrow;
    document.getElementById('screenTitle').textContent = t.title;
    document.querySelector('.screens').scrollTop = 0;
    document.getElementById('trainingSaveBar').style.display = (name === 'training') ? 'block' : 'none';
    if (name === 'kalender') renderKalender();
  }
  document.addEventListener('click', function(e){
    var el = e.target.closest('[data-nav]');
    if (el) goTo(el.dataset.nav);
  });

  // ---------- Trainingsscherm ----------
  var exerciseListEl = document.getElementById('exerciseList');
  var trainingState = {}; // huidige (nog niet opgeslagen) invoer per oefening

  var draftByEx = {}; // ingevulde (nog niet opgeslagen) waarden, per oefening-id, zodat wisselen van dag niets kwijtraakt

  function snapshotTrainingDraft(){
    trainingDay().exercises.forEach(function(ex, i){
      if (trainingState[i]) draftByEx[ex.id] = trainingState[i];
    });
  }

  function renderTrainingDayPicker(){
    var el = document.getElementById('trainingDayPicker');
    if (days.length < 2){ el.innerHTML = ''; return; }
    var sug = suggestedDayId();
    var sel = trainingDay().id;
    el.innerHTML =
      '<div class="card" style="margin-bottom:14px;">' +
        '<p class="card-title">Welke dag train je?</p>' +
        '<div class="chip-row">' +
          days.map(function(d){
            return '<button type="button" class="chip' + (d.id === sel ? ' active' : '') + '" data-train-day="' + d.id + '">' + escapeHtml(d.name) + '</button>';
          }).join('') +
        '</div>' +
        '<p class="day-hint">Aan de beurt: <b>' + escapeHtml(dayById(sug).name) + '</b>' +
          (sel !== sug ? ' — je hebt nu een andere dag gekozen.' : '.') + '</p>' +
      '</div>';
  }

  document.getElementById('trainingDayPicker').addEventListener('click', function(e){
    var b = e.target.closest('[data-train-day]');
    if (!b || b.dataset.trainDay === trainingDay().id) return;
    snapshotTrainingDraft();
    trainingDayId = b.dataset.trainDay;
    buildTrainingScreen();
    document.querySelector('.screens').scrollTop = 0;
  });

  function buildTrainingScreen(){
    exerciseListEl.innerHTML = '';
    trainingState = {};
    renderTrainingDayPicker();

    var exList = trainingDay().exercises;
    if (!exList.length){
      exerciseListEl.innerHTML =
        '<div class="card"><div class="empty">' +
          '<div class="empty-icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg></div>' +
          '<p class="small muted" style="margin:0;">Deze dag heeft nog geen oefeningen. Voeg ze toe bij Schema.</p>' +
        '</div></div>';
      return;
    }

    exList.forEach(function(ex, i){
      var last = findLastFor(ex);
      var draft = draftByEx[ex.id];
      var startW = draft ? draft.w : (last ? last.ex.weight : 0);
      var startR = draft ? draft.r : (last ? last.ex.reps : 0);
      trainingState[i] = { w:startW, r:startR, done: draft ? Object.assign({}, draft.done) : {} };

      var card = document.createElement('div');
      card.className = 'ex-card';

      var targetBits = [ex.sets + ' sets', ex.reps + ' reps'];
      var pills = '';
      if (ex.tempo) pills += '<span class="pill">tempo ' + ex.tempo + '</span>';
      if (ex.rust) pills += '<span class="pill">' + ex.rust + ' rust</span>';

      var setsHtml = '';
      for (var s = 1; s <= ex.sets; s++){
        setsHtml += '<div class="set-dot' + (trainingState[i].done[s] ? ' done' : '') + '" data-ex="' + i + '" data-set="' + s + '">' + s + '</div>';
      }

      var prevLine = last
        ? 'Vorige keer (' + formatDateNL(last.date) + '): <b>' + last.ex.weight + ' kg × ' + last.ex.reps + ' reps</b>'
        : 'Eerste keer — nog geen eerdere data';

      card.innerHTML =
        '<div class="ex-head">' +
          '<div>' +
            '<div class="ex-name">' + escapeHtml(ex.name) + '</div>' +
            '<div class="ex-target">' + targetBits.join(' · ') + '</div>' +
          '</div>' +
          '<div style="display:flex;flex-direction:column;gap:6px;align-items:flex-end;">' + pills + '</div>' +
        '</div>' +
        '<p class="ex-prev">' + prevLine + '</p>' +
        '<div class="stepper-row">' +
          '<span class="stepper-label">Gewicht</span>' +
          '<div class="num-field">' +
            '<input type="number" inputmode="decimal" step="0.25" class="num-input" data-role="w" data-ex="' + i + '" id="w-' + i + '" value="' + startW + '">' +
            '<span class="num-unit">kg</span>' +
          '</div>' +
        '</div>' +
        '<div class="stepper-row">' +
          '<span class="stepper-label">Reps</span>' +
          '<div class="num-field">' +
            '<input type="number" inputmode="numeric" step="1" class="num-input" data-role="r" data-ex="' + i + '" id="r-' + i + '" value="' + startR + '">' +
          '</div>' +
        '</div>' +
        '<div class="sets-row">' + setsHtml + '</div>';

      exerciseListEl.appendChild(card);
    });
  }

  exerciseListEl.addEventListener('click', function(e){
    var dot = e.target.closest('.set-dot');
    if (dot){
      dot.classList.toggle('done');
      var i = dot.dataset.ex, s = dot.dataset.set;
      trainingState[i].done[s] = dot.classList.contains('done');
    }
  });

  exerciseListEl.addEventListener('input', function(e){
    var inp = e.target.closest('.num-input');
    if (!inp) return;
    var idx = inp.dataset.ex;
    var st = trainingState[idx];
    var num = parseFloat(inp.value);
    if (isNaN(num)) num = 0;
    if (inp.dataset.role === 'w') st.w = Math.max(0, num);
    if (inp.dataset.role === 'r') st.r = Math.max(0, num);
  });

  document.getElementById('saveTrainingBtn').addEventListener('click', function(){
    var day = trainingDay();
    if (!day.exercises.length){ toast('Deze dag heeft nog geen oefeningen'); return; }
    var session = { date: todayISO(), dayId: day.id, dayName: day.name, exercises: [] };
    day.exercises.forEach(function(ex, i){
      var st = trainingState[i];
      var setsDone = Object.keys(st.done).filter(function(k){ return st.done[k]; }).length;
      session.exercises.push({ id: ex.id, name: ex.name, weight: st.w, reps: st.r, setsDone: setsDone, setsTarget: ex.sets });
    });
    history.push(session);
    saveJSON(HISTORY_KEY, history);
    draftByEx = {};
    trainingDayId = suggestedDayId(); // na deze training is de volgende dag aan de beurt
    var plannedIdx = planned.indexOf(session.date);
    if (plannedIdx !== -1){ planned.splice(plannedIdx, 1); saveJSON(PLANNED_KEY, planned); }
    toast('Training opgeslagen ✓');
    renderHome();
    renderHistorie();
    renderKalender();
    buildTrainingScreen();
    goTo('home');
  });

  // ---------- Historie ----------

              '<span class="num-unit">reps</span>' +
              '<input type="number" inputmode="numeric" min="0" max="' + e.setsTarget + '" step="1" class="num-input num-input-sm" data-hf="s" data-si="' + i + '" data-ei="' + ei + '" value="' + e.setsDone + '">' +

              ' &nbsp; <button type="button" class="link-btn" data-cancel-delete-session="1" style="color:var(--text-muted);">Nee</button>'

        '</div>';
      } else {
        session.exercises.forEach(function(e){
          html += '<div class="hist-row"><span class="hist-ex">' + escapeHtml(e.name) + '</span>' +

  document.getElementById('historieList').addEventListener('click', function(e){
    var editBtn = e.target.closest('[data-edit-session]');
    if (editBtn){
      editingSessionIndex = parseInt(editBtn.dataset.editSession, 10);
      deleteSessionConfirmIndex = null;
      renderHistorie();
      return;
    }
    var cancelBtn = e.target.closest('[data-cancel-session]');
    if (cancelBtn){
      editingSessionIndex = null;
      deleteSessionConfirmIndex = null;
      renderHistorie();
      return;
    }
    var saveBtn = e.target.closest('[data-save-session]');
    if (saveBtn){
      var si = parseInt(saveBtn.dataset.saveSession, 10);
      var session = history[si];
      var fields = document.querySelectorAll('[data-si="' + si + '"]');
      fields.forEach(function(inp){
        var ei = parseInt(inp.dataset.ei, 10);
        var ex = session.exercises[ei];
        var num = parseFloat(inp.value);
        if (inp.dataset.hf === 'w' && !isNaN(num)) ex.weight = Math.max(0, num);
        if (inp.dataset.hf === 'r' && !isNaN(num)) ex.reps = Math.max(0, num);
        if (inp.dataset.hf === 's' && !isNaN(num)) ex.setsDone = Math.min(ex.setsTarget, Math.max(0, Math.round(num)));
      });
      saveJSON(HISTORY_KEY, history);
      editingSessionIndex = null;
      deleteSessionConfirmIndex = null;
      renderHistorie();
      renderHome();
      toast('Training bijgewerkt ✓');

    }

    if (askDelBtn){
      deleteSessionConfirmIndex = parseInt(askDelBtn.dataset.askDeleteSession, 10);

    }
    var cancelDelBtn = e.target.closest('[data-cancel-delete-session]');
    if (cancelDelBtn){
      deleteSessionConfirmIndex = null;
      renderHistorie();

    var confirmDelBtn = e.target.closest('[data-confirm-delete-session]');
    if (confirmDelBtn){
      var di = parseInt(confirmDelBtn.dataset.confirmDeleteSession, 10);
      history.splice(di, 1);
      saveJSON(HISTORY_KEY, history);
      editingSessionIndex = null;

      renderHistorie();
      renderHome();
      renderKalender();

  // ---------- Voortgang (lichaamsmaten) ----------
  var METRICS = [
    { k:'gewicht', l:'Gewicht', unit:'kg' },
    { k:'armen', l:'Armen', unit:'cm' },
    { k:'benen', l:'Benen', unit:'cm' },
    { k:'buik', l:'Buik', unit:'cm' },
    { k:'billen', l:'Billen', unit:'cm' }
  ];

  function fmtVal(v, unit){
    if (v === null || v === undefined || isNaN(v)) return '—';
    return (v % 1 === 0 ? v : v.toFixed(1)) + ' ' + (unit || 'cm');
  }
  function fmtDelta(a, b, unit){
    if (a === null || a === undefined || isNaN(a) || b === null || b === undefined || isNaN(b)) return '—';
    var d = Math.round((b - a) * 10) / 10;
    if (d === 0) return '±0 ' + (unit || 'cm');
    return (d > 0 ? '+' : '') + d + ' ' + (unit || 'cm');
  }
  function buildSparkline(points){
    if (points.length < 2) return '';
    var w = 108, h = 28, pad = 4;
    var min = Math.min.apply(null, points), max = Math.max.apply(null, points);
    var range = (max - min) || 1;
    var stepX = (w - pad * 2) / (points.length - 1);
    var coords = points.map(function(v, i){
      var x = pad + i * stepX;
      var y = pad + (h - pad * 2) * (1 - (v - min) / range);
      return [x, y];
    });
    var poly = coords.map(function(c){ return c[0].toFixed(1) + ',' + c[1].toFixed(1); }).join(' ');
    var last = coords[coords.length - 1];
    return '<svg width="' + w + '" height="' + h + '" viewBox="0 0 ' + w + ' ' + h + '" aria-hidden="true">' +
      '<polyline points="' + poly + '" fill="none" style="stroke:var(--accent);" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>' +
      '<circle cx="' + last[0].toFixed(1) + '" cy="' + last[1].toFixed(1) + '" r="3" style="fill:var(--accent);"/>' +
      '</svg>';
  }

  function renderVoortgang(){
    var box = document.getElementById('measurementSummary');

    if (!measurements.length){
      box.innerHTML =
        '<div class="card">' +
          '<div class="empty">' +
            '<div class="empty-icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 17l6-6 4 4 8-8"/><path d="M15 7h6v6"/></svg></div>' +
            '<p class="small muted" style="margin:0;">Nog geen metingen. Zodra je je gewicht en lichaamsmaten een paar keer hebt ingevuld, zie je hier je laatste meting en het verschil met je eerste meting.</p>' +
          '</div>' +
        '</div>';
      return;
    }

    var last = measurements[measurements.length - 1];
    var first = measurements[0];

    var lastHtml =
      '<div class="card"><div class="hist-card-head">' +
      '<p class="card-title" style="margin:0;">Laatste meting — ' + formatDateNL(last.date) + '</p>' +
      '<button type="button" class="hist-edit-btn" id="editLastMeasurementBtn">Bewerken</button>' +
      '</div>' +
      '<div class="measure-grid">' +
        METRICS.map(function(m){
          return '<div class="measure-cell"><div class="measure-label">' + m.l + '</div><div class="measure-value">' + fmtVal(last[m.k], m.unit) + '</div></div>';
        }).join('') +
      '</div></div>';

    var diffHtml;
    if (measurements.length < 2){
      diffHtml =
        '<div class="card"><p class="card-title">Verschil met eerste meting</p>' +
        '<p class="small muted" style="margin:0;">Nog maar één meting. Voeg een volgende meting toe om je verschil te zien.</p></div>';
    } else {
      diffHtml =
        '<div class="card"><p class="card-title">Verschil met eerste meting (' + formatDateNL(first.date) + ')</p>' +
        '<div class="measure-grid">' +
          METRICS.map(function(m){
            return '<div class="measure-cell"><div class="measure-label">' + m.l + '</div><div class="measure-value">' + fmtDelta(first[m.k], last[m.k], m.unit) + '</div></div>';
          }).join('') +
        '</div></div>';
    }

    var trendHtml = '';
    if (measurements.length >= 2){
      trendHtml =
        '<div class="card"><p class="card-title">Ontwikkeling</p>' +
        METRICS.map(function(m){
          var pts = measurements
            .map(function(e){ return e[m.k]; })
            .filter(function(v){ return v !== null && v !== undefined && !isNaN(v); });
          if (pts.length < 2){
            return '<div class="trend-row"><span class="trend-label">' + m.l + '</span><span class="small muted">nog niet genoeg data</span></div>';
          }
          return '<div class="trend-row"><span class="trend-label">' + m.l + '</span>' + buildSparkline(pts) + '<span class="trend-value">' + fmtVal(pts[pts.length - 1], m.unit) + '</span></div>';
        }).join('') +
        '</div>';
    }

    box.innerHTML = lastHtml + diffHtml + trendHtml;
  }

  var measurementForm = document.getElementById('measurementForm');
  var addMeasurementLabel = document.getElementById('addMeasurementLabel');
  var formOpen = false;
  var editingMeasurementIndex = null; // index in measurements die nu bewerkt wordt, of null
  var deleteMeasurementConfirm = false;
  var measurementFormTitle = document.getElementById('measurementFormTitle');
  var measurementDeleteZone = document.getElementById('measurementDeleteZone');

  function renderMeasurementDeleteZone(){
    if (editingMeasurementIndex === null){
      measurementDeleteZone.innerHTML = '';
      return;
    }
    measurementDeleteZone.innerHTML = deleteMeasurementConfirm
      ? '<span class="small muted">Weet je het zeker? </span>' +
        '<button type="button" class="link-btn" id="confirmDeleteMeasurementBtn">Ja, verwijderen</button>' +
        ' &nbsp; <button type="button" class="link-btn" id="cancelDeleteMeasurementBtn" style="color:var(--text-muted);">Nee</button>'
      : '<button type="button" class="link-btn" id="askDeleteMeasurementBtn" style="color:var(--text-muted);text-decoration:underline;">Meting verwijderen</button>';
  }

  function setFormOpen(open){
    formOpen = open;
    measurementForm.style.display = open ? 'block' : 'none';
    addMeasurementLabel.textContent = open ? 'Sluiten' : 'Nieuwe meting toevoegen';
    if (open && editingMeasurementIndex === null) document.getElementById('mDate').value = todayISO();
  }
  function resetMeasurementForm(){
    editingMeasurementIndex = null;
    deleteMeasurementConfirm = false;
    measurementFormTitle.textContent = 'Nieuwe meting';
    document.getElementById('saveMeasurementBtn').textContent = 'Opslaan';
    ['mGewicht','mArmen','mBenen','mBuik','mBillen'].forEach(function(id){ document.getElementById(id).value = ''; });
    renderMeasurementDeleteZone();
  }
  function openMeasurementFormForEdit(idx){
    var m = measurements[idx];
    editingMeasurementIndex = idx;
    deleteMeasurementConfirm = false;
    measurementFormTitle.textContent = 'Meting bewerken';
    document.getElementById('saveMeasurementBtn').textContent = 'Wijzigingen opslaan';
    document.getElementById('mDate').value = m.date;
    document.getElementById('mGewicht').value = m.gewicht === null || m.gewicht === undefined ? '' : m.gewicht;
    document.getElementById('mArmen').value = m.armen === null || m.armen === undefined ? '' : m.armen;
    document.getElementById('mBenen').value = m.benen === null || m.benen === undefined ? '' : m.benen;
    document.getElementById('mBuik').value = m.buik === null || m.buik === undefined ? '' : m.buik;
    document.getElementById('mBillen').value = m.billen === null || m.billen === undefined ? '' : m.billen;
    setFormOpen(true);
    renderMeasurementDeleteZone();
  }
  measurementDeleteZone.addEventListener('click', function(e){
    if (e.target.closest('#askDeleteMeasurementBtn')){
      deleteMeasurementConfirm = true;
      renderMeasurementDeleteZone();
      return;
    }
    if (e.target.closest('#cancelDeleteMeasurementBtn')){
      deleteMeasurementConfirm = false;
      renderMeasurementDeleteZone();
      return;
    }
    if (e.target.closest('#confirmDeleteMeasurementBtn')){
      measurements.splice(editingMeasurementIndex, 1);
      saveJSON(MEASURE_KEY, measurements);
      setFormOpen(false);
      resetMeasurementForm();
      renderVoortgang();
      renderHome();
      toast('Meting verwijderd');
    }
  });
  document.getElementById('addMeasurementBtn').addEventListener('click', function(){
    if (formOpen){
      setFormOpen(false);
      resetMeasurementForm();
    } else {
      resetMeasurementForm();
      setFormOpen(true);
    }
  });
  document.getElementById('cancelMeasurementBtn').addEventListener('click', function(){
    setFormOpen(false);
    resetMeasurementForm();
  });
  document.getElementById('measurementSummary').addEventListener('click', function(e){
    var btn = e.target.closest('#editLastMeasurementBtn');
    if (btn){
      openMeasurementFormForEdit(measurements.length - 1);
    }
  });
  document.getElementById('saveMeasurementBtn').addEventListener('click', function(){
    var date = document.getElementById('mDate').value || todayISO();
    var vals = {
      gewicht: parseFloat(document.getElementById('mGewicht').value),
      armen: parseFloat(document.getElementById('mArmen').value),
      benen: parseFloat(document.getElementById('mBenen').value),
      buik: parseFloat(document.getElementById('mBuik').value),
      billen: parseFloat(document.getElementById('mBillen').value)
    };
    var hasAny = Object.keys(vals).some(function(k){ return !isNaN(vals[k]); });
    if (!hasAny){
      toast('Vul minstens één meting in');
      return;
    }
    METRICS.forEach(function(m){ if (isNaN(vals[m.k])) vals[m.k] = null; });

    if (editingMeasurementIndex !== null){
      var existing = measurements[editingMeasurementIndex];
      existing.date = date;
      existing.gewicht = vals.gewicht; existing.armen = vals.armen; existing.benen = vals.benen;
      existing.buik = vals.buik; existing.billen = vals.billen;
      measurements.sort(function(a, b){ return a.date < b.date ? -1 : a.date > b.date ? 1 : 0; });
      saveJSON(MEASURE_KEY, measurements);
      setFormOpen(false);
      resetMeasurementForm();
      toast('Meting bijgewerkt ✓');
    } else {
      measurements.push({ date: date, gewicht: vals.gewicht, armen: vals.armen, benen: vals.benen, buik: vals.buik, billen: vals.billen });
      measurements.sort(function(a, b){ return a.date < b.date ? -1 : a.date > b.date ? 1 : 0; });
      saveJSON(MEASURE_KEY, measurements);
      setFormOpen(false);
      resetMeasurementForm();
      toast('Meting opgeslagen ✓');
    }
    renderVoortgang();
    renderHome();
  });

  // ---------- Schema ----------
  var schemaListEl = document.getElementById('schemaList');
  var editingId = null;   // id van oefening die nu bewerkt wordt, of null
  var addingNew = false;  // formulier voor nieuwe oefening open?
  var deleteConfirmId = null; // id waarvoor net op "verwijderen" is getikt

  // ----- Trainingsdagen beheren (bovenaan het Schema-scherm) -----
  var dayMode = null; // null | 'new' | 'rename' | 'delete'

  function renderDayTabs(){
    var el = document.getElementById('dayTabs');
    var cur = schemaDay();
    var idx = days.indexOf(cur);
    var html =
      '<div class="card">' +
        '<p class="card-title">Trainingsdagen</p>' +
        '<div class="chip-row">' +
          days.map(function(d){
            return '<button type="button" class="chip' + (d.id === cur.id ? ' active' : '') + '" data-schema-day="' + d.id + '">' + escapeHtml(d.name) + '</button>';
          }).join('') +
          '<button type="button" class="chip chip-add" data-day-add="1">+ Dag</button>' +
        '</div>';

    if (days.length > 1){
      html += '<p class="day-hint">Na elke training stelt de app de volgende dag voor, in deze volgorde: <b>' +
        days.map(function(d){ return escapeHtml(d.name); }).join(' → ') + '</b>, en daarna weer van voren af aan.</p>';
    } else {
      html += '<p class="day-hint">Train je op aparte dagen, bijvoorbeeld Push, Pull en Legs? Voeg met “+ Dag” een trainingsdag toe met een eigen lijst oefeningen.</p>';
    }

    if (dayMode === 'new' || dayMode === 'rename'){
      html +=
        '<div class="day-form form-grid">' +
          '<label style="grid-column:1 / -1;">' + (dayMode === 'new' ? 'Naam van de nieuwe dag' : 'Nieuwe naam voor deze dag') +
            '<input type="text" id="dayNameInput" maxlength="30" placeholder="bv. Push" value="' + (dayMode === 'rename' ? escapeHtml(cur.name) : '') + '"></label>' +
          '<div style="grid-column:1 / -1;display:flex;gap:10px;">' +
            '<button type="button" class="btn-secondary" data-day-cancel="1" style="flex:1;">Annuleren</button>' +
            '<button type="button" class="btn-save" data-day-save="' + dayMode + '" style="flex:1;">' + (dayMode === 'new' ? 'Toevoegen' : 'Opslaan') + '</button>' +
          '</div>' +
        '</div>';
    } else if (dayMode === 'delete'){
      html +=
        '<div class="day-form">' +
          '<p class="small" style="margin:0 0 12px;">Dag <b>' + escapeHtml(cur.name) + '</b> en de ' + cur.exercises.length +
            ' oefeningen daarin verwijderen? Je opgeslagen trainingen in Historie blijven bewaard.</p>' +
          '<div style="display:flex;gap:10px;">' +
            '<button type="button" class="btn-secondary" data-day-cancel="1" style="flex:1;">Nee</button>' +
            '<button type="button" class="btn-save" data-day-confirm-delete="1" style="flex:1;">Ja, verwijderen</button>' +
          '</div>' +
        '</div>';
    } else {
      html +=
        '<div class="day-actions">' +
          '<button type="button" class="link-btn" data-day-rename="1">Naam wijzigen</button>' +
          (idx > 0 ? '<button type="button" class="link-btn" data-day-move="-1">← Eerder</button>' : '') +
          (idx < days.length - 1 ? '<button type="button" class="link-btn" data-day-move="1">Later →</button>' : '') +
          (days.length > 1 ? '<button type="button" class="link-btn" data-day-delete="1" style="color:var(--text-muted);">Dag verwijderen</button>' : '') +
        '</div>';
    }
    html += '</div>';
    el.innerHTML = html;
  }

  function afterDaysChange(){
    if (!dayById(trainingDayId)) trainingDayId = suggestedDayId();
    buildSchemaScreen();
    buildTrainingScreen();
    renderHome();
    renderHistorie();
  }

  document.getElementById('dayTabs').addEventListener('click', function(e){
    var el;
    if ((el = e.target.closest('[data-schema-day]'))){
      schemaDayId = el.dataset.schemaDay;
      dayMode = null; editingId = null; addingNew = false; deleteConfirmId = null;
      buildSchemaScreen(); return;
    }
    if (e.target.closest('[data-day-add]')){
      dayMode = 'new'; buildSchemaScreen();
      var inp = document.getElementById('dayNameInput'); if (inp) inp.focus();
      return;
    }
    if (e.target.closest('[data-day-rename]')){
      dayMode = 'rename'; buildSchemaScreen();
      var inp2 = document.getElementById('dayNameInput'); if (inp2) inp2.focus();
      return;
    }
    if (e.target.closest('[data-day-delete]')){ dayMode = 'delete'; buildSchemaScreen(); return; }
    if (e.target.closest('[data-day-cancel]')){ dayMode = null; buildSchemaScreen(); return; }

    if ((el = e.target.closest('[data-day-save]'))){
      var name = document.getElementById('dayNameInput').value.trim();
      if (!name){ toast('Vul een naam in'); return; }
      if (el.dataset.daySave === 'new'){
        var nd = { id: newId('dag'), name: name, exercises: [] };
        days.push(nd);
        schemaDayId = nd.id;
        toast('Dag toegevoegd ✓');
      } else {
        schemaDay().name = name;
        toast('Naam opgeslagen ✓');
      }
      dayMode = null; editingId = null; addingNew = false; deleteConfirmId = null;
      saveDays(); afterDaysChange(); return;
    }
    if (e.target.closest('[data-day-confirm-delete]')){
      if (days.length < 2) return;
      var cur = schemaDay(), at = days.indexOf(cur);
      days.splice(at, 1);
      schemaDayId = days[Math.max(0, at - 1)].id;
      if (trainingDayId === cur.id) trainingDayId = null;
      dayMode = null; editingId = null; addingNew = false; deleteConfirmId = null;
      saveDays();
      trainingDayId = trainingDayId || suggestedDayId();
      toast('Dag verwijderd');
      afterDaysChange(); return;
    }
    if ((el = e.target.closest('[data-day-move]'))){
      var from = days.indexOf(schemaDay()), to = from + parseInt(el.dataset.dayMove, 10);
      if (to < 0 || to >= days.length) return;
      var moved = days.splice(from, 1)[0];
      days.splice(to, 0, moved);
      saveDays(); afterDaysChange(); return;
    }
  });

  function schemaFormHtml(ex, prefix){
    return (
      '<div class="form-grid">' +
        '<label style="grid-column:1 / -1;">Naam' +
          '<input type="text" id="' + prefix + '-name" value="' + escapeHtml(ex.name || '') + '" placeholder="Naam oefening"></label>' +
        '<label>Sets' +
          '<input type="number" inputmode="numeric" min="1" id="' + prefix + '-sets" value="' + (ex.sets || 3) + '"></label>' +
        '<label>Reps' +
          '<input type="text" id="' + prefix + '-reps" value="' + escapeHtml(ex.reps || '') + '" placeholder="bv. 8-10"></label>' +
        '<label>Tempo' +
          '<input type="text" id="' + prefix + '-tempo" value="' + escapeHtml(ex.tempo || '') + '" placeholder="bv. 3010"></label>' +
        '<label>Rust' +
          '<input type="text" id="' + prefix + '-rust" value="' + escapeHtml(ex.rust || '') + '" placeholder="bv. 45 sec"></label>' +
        '<label style="grid-column:1 / -1;">Apparaat-instelling' +
          '<input type="text" id="' + prefix + '-apparaat" value="' + escapeHtml(ex.apparaat || '') + '" placeholder="bv. stand 4, rugleuning 2"></label>' +
        '<label style="grid-column:1 / -1;">Notitie' +
          '<input type="text" id="' + prefix + '-notitie" value="' + escapeHtml(ex.notitie || '') + '" placeholder="Eigen notitie (optioneel)"></label>' +
      '</div>'
    );
  }

  function buildSchemaScreen(){
    schemaListEl.innerHTML = '';
    renderDayTabs();
    document.getElementById('addExerciseLabel').textContent =
      days.length > 1 ? 'Oefening toevoegen aan ' + schemaDay().name : 'Oefening toevoegen';

    var sdExercises = schemaDay().exercises;
    if (!sdExercises.length && !addingNew){
      schemaListEl.innerHTML =
        '<div class="card"><div class="empty">' +
          '<div class="empty-icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg></div>' +
          '<p class="small muted" style="margin:0;">Deze dag heeft nog geen oefeningen. Voeg er hieronder een toe.</p>' +
        '</div></div>';
    }

    sdExercises.forEach(function(ex){
      var row = document.createElement('div');
      row.className = 'card';

      if (editingId === ex.id){
        row.innerHTML =
          schemaFormHtml(ex, 'e') +
          '<div style="display:flex;gap:10px;margin-top:14px;">' +
            '<button type="button" class="btn-secondary" data-cancel-edit="1" style="flex:1;">Annuleren</button>' +
            '<button type="button" class="btn-save" data-save-edit="' + ex.id + '" style="flex:1;">Opslaan</button>' +
          '</div>' +
          '<div style="margin-top:12px;text-align:center;">' +
            (deleteConfirmId === ex.id
              ? '<span class="small muted">Weet je het zeker? </span>' +
                '<button type="button" class="link-btn" data-confirm-delete="' + ex.id + '">Ja, verwijderen</button>' +
                ' &nbsp; <button type="button" class="link-btn" data-cancel-delete="1" style="color:var(--text-muted);">Nee</button>'
              : '<button type="button" class="link-btn" data-ask-delete="' + ex.id + '" style="color:var(--text-muted);text-decoration:underline;">Oefening verwijderen</button>')  +
          '</div>';
      } else {
        var metaBits = [ex.sets + ' sets', ex.reps + ' reps'];
        if (ex.tempo) metaBits.push('tempo ' + ex.tempo);
        if (ex.rust) metaBits.push(ex.rust + ' rust');
        var extra = '';
        if (ex.apparaat) extra += '<div class="schema-meta">Apparaat: ' + escapeHtml(ex.apparaat) + '</div>';
        if (ex.notitie) extra += '<div class="schema-meta">' + escapeHtml(ex.notitie) + '</div>';
        row.className = 'card schema-card';
        row.innerHTML =
          '<div>' +
            '<div class="ex-name" style="font-size:16px;">' + escapeHtml(ex.name) + '</div>' +
            '<div class="schema-meta">' + metaBits.join(' · ') + '</div>' +
            extra +
          '</div>' +
          '<button type="button" class="icon-btn" data-edit="' + ex.id + '">' +
            '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>' +
          '</button>';
      }
      schemaListEl.appendChild(row);
    });

    if (addingNew){
      var newCard = document.createElement('div');
      newCard.className = 'card';
      newCard.innerHTML =
        '<p class="card-title">Nieuwe oefening</p>' +
        schemaFormHtml({ sets:3 }, 'n') +
        '<div style="display:flex;gap:10px;margin-top:14px;">' +
          '<button type="button" class="btn-secondary" data-cancel-new="1" style="flex:1;">Annuleren</button>' +
          '<button type="button" class="btn-save" data-save-new="1" style="flex:1;">Toevoegen</button>' +
        '</div>';
      schemaListEl.appendChild(newCard);
    }
  }

  function readFormValues(prefix){
    var name = document.getElementById(prefix + '-name').value.trim();
    var sets = parseInt(document.getElementById(prefix + '-sets').value, 10);
    var reps = document.getElementById(prefix + '-reps').value.trim();
    var tempo = document.getElementById(prefix + '-tempo').value.trim();
    var rust = document.getElementById(prefix + '-rust').value.trim();
    var apparaat = document.getElementById(prefix + '-apparaat').value.trim();
    var notitie = document.getElementById(prefix + '-notitie').value.trim();
    return {
      name: name, sets: (isNaN(sets) || sets < 1) ? 1 : sets,
      reps: reps || '—', tempo: tempo || null, rust: rust || null,
      apparaat: apparaat || null, notitie: notitie || null
    };
  }

  schemaListEl.addEventListener('click', function(e){
    var el;
    if ((el = e.target.closest('[data-edit]'))){
      editingId = el.dataset.edit; addingNew = false; deleteConfirmId = null; buildSchemaScreen(); return;
    }
    if ((el = e.target.closest('[data-cancel-edit]'))){
      editingId = null; deleteConfirmId = null; buildSchemaScreen(); return;
    }
    if ((el = e.target.closest('[data-save-edit]'))){
      var id = el.dataset.saveEdit;
      var ex = schemaDay().exercises.find(function(x){ return x.id === id; });
      if (!ex) return;
      var vals = readFormValues('e');
      if (!vals.name){ toast('Vul een naam in'); return; }
      Object.assign(ex, vals);
      saveDays();
      editingId = null;
      toast('Oefening opgeslagen ✓');
      buildSchemaScreen();
      buildTrainingScreen();
      renderHome();
      return;
    }
    if ((el = e.target.closest('[data-ask-delete]'))){
      deleteConfirmId = el.dataset.askDelete; buildSchemaScreen(); return;
    }
    if ((el = e.target.closest('[data-cancel-delete]'))){
      deleteConfirmId = null; buildSchemaScreen(); return;
    }
    if ((el = e.target.closest('[data-confirm-delete]'))){
      var delId = el.dataset.confirmDelete;
      var sd = schemaDay();
      sd.exercises = sd.exercises.filter(function(x){ return x.id !== delId; });
      saveDays();
      editingId = null; deleteConfirmId = null;
      toast('Oefening verwijderd');
      buildSchemaScreen();
      buildTrainingScreen();
      renderHome();
      return;
    }
    if ((el = e.target.closest('[data-cancel-new]'))){
      addingNew = false; buildSchemaScreen(); return;
    }
    if ((el = e.target.closest('[data-save-new]'))){
      var nv = readFormValues('n');
      if (!nv.name){ toast('Vul een naam in'); return; }
      nv.id = slugify(nv.name) + '-' + Math.random().toString(36).slice(2, 6);
      schemaDay().exercises.push(nv);
      saveDays();
      addingNew = false;
      toast('Oefening toegevoegd ✓');
      buildSchemaScreen();
      buildTrainingScreen();
      renderHome();
      return;
    }
  });

  document.getElementById('addExerciseBtn').addEventListener('click', function(){
    addingNew = !addingNew;
    editingId = null; deleteConfirmId = null;
    buildSchemaScreen();
  });

  // ---------- Toetsenbord: houd knoppen onder formulieren bereikbaar ----------
  // Op iPhone kan het toetsenbord een "Opslaan"-knop onderin een formulier
  // bedekken. We meten de echte hoogte van het toetsenbord (via visualViewport)
  // en maken precies zoveel ruimte vrij als nodig — geen vaste, te grote
  // lege ruimte die de knop midden in beeld laat "zweven".
  (function(){
    var screensEl = document.querySelector('.screens');
    var activeInput = null;

    function applyKeyboardSpace(){
      if (!window.visualViewport) return;
      var vv = window.visualViewport;
      var kbHeight = Math.max(0, window.innerHeight - vv.height - vv.offsetTop);
      if (kbHeight > 80 && activeInput){
        screensEl.style.paddingBottom = (kbHeight + 20) + 'px';
        screensEl.classList.add('kb-open');
        activeInput.scrollIntoView({ block:'nearest', behavior:'smooth' });
      } else {
        screensEl.style.paddingBottom = '';
        screensEl.classList.remove('kb-open');
      }
    }

    document.addEventListener('focusin', function(e){
      if (e.target.matches('input')){
        activeInput = e.target;
        setTimeout(applyKeyboardSpace, 250);
      }
    });
    document.addEventListener('focusout', function(e){
      if (e.target.matches('input')){
        setTimeout(function(){
          if (!document.activeElement || !document.activeElement.matches('input')){
            activeInput = null;
            screensEl.style.paddingBottom = '';
            screensEl.classList.remove('kb-open');
          }
        }, 150);
      }
    });
    if (window.visualViewport){
      window.visualViewport.addEventListener('resize', applyKeyboardSpace);
    }
  })();

  // ---------- Kalender ----------
  var calendarViewDate = new Date(); // maand die nu getoond wordt
  var MONTH_NAMES_NL = ['januari','februari','maart','april','mei','juni','juli','augustus','september','oktober','november','december'];

  function isoFromParts(y, m, d){
    var mm = String(m + 1).padStart(2, '0');
    var dd = String(d).padStart(2, '0');
    return y + '-' + mm + '-' + dd;
  }
  function isTrainedDate(iso){
    return history.some(function(s){ return s.date === iso; });
  }
  function isPlannedDate(iso){
    return planned.indexOf(iso) !== -1;
  }

  function renderKalender(){
    var y = calendarViewDate.getFullYear();
    var m = calendarViewDate.getMonth();
    document.getElementById('calMonthLabel').textContent = MONTH_NAMES_NL[m] + ' ' + y;

    var firstOfMonth = new Date(y, m, 1);
    var startOffset = (firstOfMonth.getDay() + 6) % 7; // maandag = 0
    var daysInMonth = new Date(y, m + 1, 0).getDate();
    var today = todayISO();

    var html = '';
    for (var i = 0; i < startOffset; i++){
      html += '<div class="cal-day cal-empty"></div>';
    }
    for (var d = 1; d <= daysInMonth; d++){
      var iso = isoFromParts(y, m, d);
      var cls = 'cal-day';
      if (iso === today) cls += ' cal-today';
      if (isTrainedDate(iso)) cls += ' cal-trained';
      else if (isPlannedDate(iso)) cls += ' cal-planned';
      html += '<div class="' + cls + '" data-cal-day="' + iso + '">' + d + '</div>';
    }
    document.getElementById('calGrid').innerHTML = html;

    var weekStart = startOfWeekISO();
    var weekCount = history.filter(function(s){ return s.date >= weekStart; }).length;
    document.getElementById('calWeekStat').innerHTML =
      '<p class="card-title" style="margin:0 0 4px;">Deze week</p>' +
      '<p style="margin:0;font-size:15px;">' + weekCount + ' training' + (weekCount === 1 ? '' : 'en') + ' afgerond</p>';
  }

  document.getElementById('calPrevBtn').addEventListener('click', function(){
    calendarViewDate.setMonth(calendarViewDate.getMonth() - 1);
    renderKalender();
  });
  document.getElementById('calNextBtn').addEventListener('click', function(){
    calendarViewDate.setMonth(calendarViewDate.getMonth() + 1);
    renderKalender();
  });
  document.getElementById('calGrid').addEventListener('click', function(e){
    var cell = e.target.closest('[data-cal-day]');
    if (!cell) return;
    var iso = cell.dataset.calDay;
    if (isTrainedDate(iso)) return; // al getraind — niet te (ont)plannen
    var idx = planned.indexOf(iso);
    if (idx === -1) planned.push(iso); else planned.splice(idx, 1);
    saveJSON(PLANNED_KEY, planned);
    renderKalender();
  });

  // ---------- Start ----------
  buildTrainingScreen();
  buildSchemaScreen();
  renderKalender();
  renderHome();
  renderHistorie();
  renderVoortgang();
})();
</script>
</body>
</html>
